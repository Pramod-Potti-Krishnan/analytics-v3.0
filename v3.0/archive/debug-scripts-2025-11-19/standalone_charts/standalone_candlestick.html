<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candlestick Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body style="margin: 0; padding: 20px; background: #f5f5f5;">
    <h1 style="font-family: Arial; color: #333;">Candlestick Chart (candlestick)</h1>
    <!-- Candlestick/Financial Chart with Chart.js Financial Plugin -->
<script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>

<div class="l02-chart-container" style="width: 1260px; height: 720px; position: relative; background: white; padding: 20px; box-sizing: border-box;">
    <canvas id="chart-slide-candlestick"></canvas>
    <script>
        (function() {
            function initCandlestick() {
                // v3.3.4: Destroy existing chart to replay animation
                if (window.chartInstances && window.chartInstances['chart-slide-candlestick']) {
                    console.log('Chart chart-slide-candlestick exists, destroying to replay animation...');
                    window.chartInstances['chart-slide-candlestick'].destroy();
                    delete window.chartInstances['chart-slide-candlestick'];
                }

                const ctx = document.getElementById('chart-slide-candlestick').getContext('2d');
                const config = {"type": "candlestick", "data": {"datasets": []}, "options": {"responsive": true, "maintainAspectRatio": false, "plugins": {"legend": {"display": false, "position": "top", "labels": {"font": {"size": 14}}}, "tooltip": {"mode": "index", "intersect": false, "callbacks": {"label": function(ctx) {
                const data = ctx.parsed;
                return [
                    'Open: ' + data.o.toFixed(2),
                    'High: ' + data.h.toFixed(2),
                    'Low: ' + data.l.toFixed(2),
                    'Close: ' + data.c.toFixed(2)
                ];
            }}}, "title": {"display": false}}, "scales": {"x": {"type": "time", "time": {"unit": "day", "displayFormats": {"day": "MMM d"}}, "ticks": {"font": {"size": 12}}, "grid": {"display": false}}, "y": {"beginAtZero": false, "ticks": {"font": {"size": 12}, "callback": function(value) { return value.toFixed(2); }}, "grid": {"color": "rgba(0, 0, 0, 0.1)"}}}}};

                const chart = new Chart(ctx, config);

                // Store for editor access
                window.chartInstances = window.chartInstances || {};
                window.chartInstances['chart-slide-candlestick'] = chart;

                console.log('✅ Candlestick chart-slide-candlestick initialized');
            }

            // Initialize after financial plugin loads
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initCandlestick);
            } else {
                initCandlestick();
            }

            // v3.3.4: Reinitialize on slide change for animation replay
            if (typeof Reveal !== 'undefined') {
                Reveal.on('slidechanged', function(event) {
                    try {
                        if (event.currentSlide && event.currentSlide.querySelector('#chart-slide-candlestick')) {
                            initCandlestick();
                        }
                    } catch (e) {
                        console.warn('Candlestick init on slide change failed:', e);
                    }
                });
            }
        })();
    </script>
</div>
</body>
</html>
