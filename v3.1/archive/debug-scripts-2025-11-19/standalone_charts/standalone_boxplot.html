<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxplot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body style="margin: 0; padding: 20px; background: #f5f5f5;">
    <h1 style="font-family: Arial; color: #333;">Boxplot (boxplot)</h1>
    <!-- Boxplot Chart with Chart.js Boxplot Plugin -->
<script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.4.5/build/index.umd.min.js"></script>

<div class="l02-chart-container" style="width: 1260px; height: 720px; position: relative; background: white; padding: 20px; box-sizing: border-box;">
    <canvas id="chart-slide-boxplot"></canvas>
    <script>
        (function() {
            function initBoxplot() {
                const ctx = document.getElementById('chart-slide-boxplot').getContext('2d');
                const config = {"type": "boxplot", "data": {"labels": ["Item 0"], "datasets": []}, "options": {"responsive": true, "maintainAspectRatio": false, "plugins": {"legend": {"display": false, "position": "top"}, "tooltip": {"callbacks": {"label": function(ctx) {
                const data = ctx.parsed;
                return [
                    'percentage - Max: ' + data.max,
                    'Q3: ' + data.q3,
                    'Median: ' + data.median,
                    'Q1: ' + data.q1,
                    'Min: ' + data.min
                ];
            }}}}, "scales": {"y": {"beginAtZero": false, "ticks": {"font": {"size": 12}}, "grid": {"color": "rgba(0, 0, 0, 0.1)"}}, "x": {"ticks": {"font": {"size": 12}}, "grid": {"display": false}}}}};

                const chart = new Chart(ctx, config);

                // Store for editor access
                window.chartInstances = window.chartInstances || {};
                window.chartInstances['chart-slide-boxplot'] = chart;

                console.log('✅ Boxplot chart-slide-boxplot initialized');
            }

            // Initialize after boxplot plugin loads
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBoxplot);
            } else {
                initBoxplot();
            }
        })();
    </script>
</div>
</body>
</html>
